[package]
name = "passage_desktop"
version = "0.1.0"
description = "Passage desktop shell"
authors = ["Plunz"]
edition = "2021"

[lib]
name = "passage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = [] }
url = "2"
