name: Release Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (for example, 0.1.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a version in X.Y.Z format.' >&2
            exit 1
          fi
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false

      - name: Set artifact version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          for name in ('desktop/package.json', 'extension/package.json'):
              path = Path(name)
              data = json.loads(path.read_text())
              data['version'] = version
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Build and check
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm --filter @passage/desktop build
          pnpm build:extension
          go test ./internal/... ./native-host/... ./desktop/...
          go build -o desktop/build/passage ./desktop
          go build -o native-host/build/passage-native-host ./native-host
          python3 native-host/tests/integration.py native-host/build/passage-native-host

      - name: Package
        run: |
          ./scripts/package-linux.sh
          cd dist/release
          sha256sum -c passage-linux-x86_64.tar.gz.sha256
          sha256sum -c passage-extension-chromium.tar.gz.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/release/passage-linux-x86_64.tar.gz \
            dist/release/passage-linux-x86_64.tar.gz.sha256 \
            dist/release/passage-extension-chromium.tar.gz \
            dist/release/passage-extension-chromium.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest
