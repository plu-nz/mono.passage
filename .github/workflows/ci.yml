name: CI

on:
  push:
    branches: [main, plan/wails3-solid-migration]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config pass gnupg
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false
      - name: Build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm --filter @passage/desktop build
          pnpm build:extension
          go test ./internal/... ./native-host/... ./desktop/...
          go build -o desktop/build/passage ./desktop
          go build -o native-host/build/passage-native-host ./native-host
          python3 native-host/tests/integration.py native-host/build/passage-native-host
          ./scripts/package-linux.sh
